name: Native speech checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/platform/**'
      - '.github/workflows/speech-native.yml'

permissions:
  contents: read

# The project's macOS slots are reserved for releases. Contributor forks can run these
# small native checks on push; upstream runs them only when explicitly dispatched.
jobs:
  speech:
    if: github.event_name == 'workflow_dispatch' || github.repository != 'storytold/pdfcraft'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Linux synthesis and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev espeak-ng
      - name: Compile and lint all platform targets
        run: cargo clippy -p pdfcraft-platform --all-targets --locked -- -D warnings
      - name: Silent lifecycle, voice and playback controls
        run: cargo test -p pdfcraft-platform --locked
      - name: Native English synthesis (no audio device)
        if: runner.os != 'Windows'
        run: cargo test -p pdfcraft-platform native_synthesizes_english_to_valid_audio --locked -- --ignored --nocapture
      - name: Native Italian synthesis (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p pdfcraft-platform native_synthesizes_italian_to_valid_audio --locked -- --ignored --nocapture
      - name: Native Italian synthesis (macOS, when installed)
        if: runner.os == 'macOS'
        run: |
          if /usr/bin/say -v '?' | grep 'it_IT' >/dev/null; then
            cargo test -p pdfcraft-platform native_synthesizes_italian_to_valid_audio --locked -- --ignored --nocapture
          else
            echo 'Italian voice not installed on this runner: Italian native synthesis NOT TESTED.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Native Windows English synthesis (no audio device)
        if: runner.os == 'Windows'
        run: cargo test -p pdfcraft-platform windows_speech_synthesizes_english_to_audio --locked -- --ignored --nocapture
