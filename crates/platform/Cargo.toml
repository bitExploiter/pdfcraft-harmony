[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `https::transport()`, the network remote signing goes through. Only the desktop app and the
# command-line tool turn it on; nothing else links a network stack.
https = ["dep:ureq", "dep:rustls-native-certs", "dep:pdfcraft-sign"]

[dependencies]
# HTTPS over rustls with the OS's trusted roots, as Help ▸ Check for updates does (no bundled
# root list: webpki-roots and webpki-root-certs are CDLA-licensed).
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
pdfcraft-sign = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `write_atomically`: a volume that refuses F_FULLFSYNC gets a plain fsync.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# The crate itself with `https` on, so `cargo test -p pdfcraft-platform` and clippy cover the
# transport and its tests while builds never link it.
pdfcraft-platform = { path = ".", features = ["https"] }
# The transport's tests serve the in-process signing service over loopback HTTP and, with
# rustls's server side (already in the graph through ureq), HTTPS.
pdfcraft-sign = { workspace = true, features = ["mock"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"
